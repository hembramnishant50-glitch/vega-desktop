<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a5a"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="48" ry="48" fill="url(#bg)"/>
  
  <!-- Outer TV frame -->
  <rect x="72" y="140" width="368" height="280" rx="24" ry="24" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Antenna left -->
  <path d="M168 140 Q168 100 192 100 Q216 100 216 140" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Antenna right -->
  <path d="M296 140 Q296 100 320 100 Q344 100 344 140" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Inner screen -->
  <rect x="120" y="188" width="272" height="184" rx="20" ry="20" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Play button -->
  <path d="M216 240 L296 280 L216 320 Z" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linejoin="round"/>
  
  <!-- Left dot -->
  <circle cx="48" cy="280" r="10" fill="#a0a0a0"/>
  
  <!-- Right dot -->
  <circle cx="464" cy="280" r="10" fill="#a0a0a0"/>
  
  <!-- Top cross -->
  <path d="M256 60 L256 80 M246 70 L266 70" stroke="#a0a0a0" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Bottom cross -->
  <path d="M256 432 L256 452 M246 442 L266 442" stroke="#a0a0a0" stroke-width="6" stroke-linecap="round"/>
</svg>
